name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # بازه معاملات: ۱۱:۰۰ تا ۲۱:۰۰ به‌وقت ایران (UTC+3:30) = ۰۷:۳۰ تا ۱۷:۳۰ UTC، هر ۱۵ دقیقه
    # (برای به‌روزرسانی صفحه‌ی قیمت طلا/ارز که در زمان build گرفته می‌شود)
    - cron: "30,45 7 * * *"
    - cron: "0,15,30,45 8-16 * * *"
    - cron: "0,15,30 17 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
